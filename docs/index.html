<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>Nova</title>
<style>
:root{--bg:#f7f7f8;--sidebar:#f0f0f2;--panel:#fff;--text:#0d0d0d;--muted:#6e6e80;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.12);--accent:#0d0d0d;--user-bg:#ebebf0;--soft:rgba(0,0,0,.04);--violet:#7c6cf0;--font:"Inter","Segoe UI",system-ui,sans-serif;--shadow:0 8px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.app{height:100dvh;height:100vh;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding:12px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:8px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#c4b5fd,#7c6cf0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.pill{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;background:#ebe4ff;color:#5b4bb0}
.newchat{padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--panel);font-size:.9rem;font-weight:500;text-align:left}
.newchat:hover{background:#fafafa}
.section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px}
.history{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.history button{text-align:left;padding:9px 12px;border-radius:10px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history button:hover{background:var(--soft)}.history button.active{background:#e4e4ea;font-weight:600}
.side-bottom{border-top:1px solid var(--border);padding-top:10px;display:grid;gap:6px}
.sidebtn{text-align:left;padding:10px 12px;border-radius:10px;font-size:.88rem}
.sidebtn:hover{background:var(--soft)}
.privacy{font-size:.7rem;color:var(--muted);padding:6px 8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border)}
.model{font-weight:650}.top-actions{display:flex;align-items:center;gap:8px}
.mode-select{border:1px solid var(--border2);border-radius:10px;padding:6px 10px;background:var(--panel);font-size:.82rem}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center}
.chat{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 16px;-webkit-overflow-scrolling:touch}
.chat-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;padding:48px 12px;margin:auto}
.orb{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:radial-gradient(circle at 35% 25%,#e4ddff,#8d7bea 55%,#4c3e9d)}
.welcome h1{font-size:1.45rem;margin-bottom:8px}.welcome p{color:var(--muted);font-size:.92rem;margin-bottom:18px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:0 auto}
.suggestions button{padding:12px;border-radius:12px;border:1px solid var(--border2);background:var(--panel);text-align:left;font-size:.85rem}
.message{display:flex;gap:10px;align-items:flex-start}.message.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:50%;background:#ebe4ff;color:#5b4bb0;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.message.user .avatar{background:#e4e4ea;color:#333}
.bubble{max-width:min(100%,560px);padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--border);line-height:1.5;font-size:.95rem;white-space:pre-wrap;word-break:break-word}
.message.user .bubble{background:var(--user-bg);border-color:transparent}
.bubble.typing{color:var(--muted)}
.msg-tools{display:flex;gap:6px;margin-top:8px}
.msg-tools button{font-size:.72rem;padding:5px 9px;border-radius:8px;border:1px solid var(--border2);background:#fafafa;color:var(--muted)}
.bubble a{color:#4f46e5;text-decoration:underline;word-break:break-all}
.code-block{margin:.55em 0;border:1px solid #2a2f3d;border-radius:12px;overflow:hidden;background:#0f1117}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#1a1d27;color:#c8c8d0;font-size:.72rem;gap:8px}
.code-head button{padding:4px 8px;border-radius:6px;background:#2a2f3d;color:#e8e8f0;font-size:.72rem}
.code-block pre{margin:0;padding:12px;overflow:auto;max-height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.45;color:#e8e8f0;white-space:pre}
.html-preview{margin-top:8px;border:1px solid var(--border2);border-radius:10px;overflow:hidden}
.html-preview iframe{width:100%;height:260px;border:0;background:#fff}
.composer-wrap{flex:0 0 auto;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.composer{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--border2);border-radius:24px;padding:10px 12px;box-shadow:var(--shadow)}
.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:0;outline:none;resize:none;background:transparent;min-height:24px;max-height:140px;line-height:1.45;font-size:16px;padding:6px 0}
.tool{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;background:#fafafa;flex-shrink:0}
.tool.on{background:#ebe4ff;border-color:#c4b5fd}
.send{width:44px;height:44px;min-width:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0;font-size:1.1rem}
.send:disabled{opacity:.35}
.composer-hint{max-width:720px;margin:8px auto 0;text-align:center;font-size:.72rem;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-backdrop.open{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:90dvh;overflow:auto;box-shadow:var(--shadow)}
.modal h2{font-size:1.1rem;margin-bottom:8px}.modal p{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.modal label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.modal input,.modal textarea{width:100%;border:1px solid var(--border2);border-radius:10px;padding:10px;background:#fafafa}
.modal textarea{min-height:70px;resize:vertical}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.primary{padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;font-size:.88rem}
.secondary{padding:9px 14px;border-radius:10px;border:1px solid var(--border2);background:#fafafa;font-size:.88rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#221d38;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60;font-size:.85rem;max-width:90vw}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.suggestions{grid-template-columns:1fr}.composer-wrap{padding:8px 10px calc(12px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">N</div> Nova <span class="pill">v23</span></div>
  <button type="button" class="newchat" id="newChat">+ Nuevo chat</button>
  <div class="section-label">Conversaciones</div>
  <div class="history" id="history"></div>
  <div class="side-bottom">
    <button type="button" class="sidebtn" id="memoryBtn">Memoria</button>
    <button type="button" class="sidebtn" id="settingsBtn">Ajustes</button>
    <div class="privacy">Gemini · v23 estable</div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="model">Nova <span style="color:#999;font-weight:400">· asistente</span></div>
    <div class="top-actions">
      <select class="mode-select" id="modeSelect">
        <option value="equilibrado">Equilibrado</option>
        <option value="amigable">Amigable</option>
        <option value="directo">Directo</option>
        <option value="filosofico">Filosofico</option>
        <option value="creativo">Creativo</option>
        <option value="tecnico">Tecnico</option>
      </select>
      <button type="button" class="iconbtn" id="mobileSettings">⚙</button>
    </div>
  </header>
  <section class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></section>
  <div class="composer-wrap">
    <form class="composer" id="composer">
      <div class="composer-row">
        <textarea id="prompt" rows="1" placeholder="Escribe a Nova…"></textarea>
        <button type="button" class="tool" id="btnMic" title="Dictar">🎤</button>
        <button type="button" class="send" id="send">↑</button>
      </div>
    </form>
    <div class="composer-hint">Enter envia · mic dicta · v23</div>
  </div>
</main>
</div>
<div class="modal-backdrop" id="memoryModal"><div class="modal">
  <h2>Memoria</h2><p>Notas en este navegador.</p>
  <div id="ltList" style="margin-bottom:10px;font-size:.88rem"></div>
  <label>Nueva nota</label><input id="ltInput" placeholder="Prefiero respuestas cortas…" />
  <div class="modal-actions">
    <button type="button" class="secondary" data-close="memoryModal">Cerrar</button>
    <button type="button" class="primary" id="ltAdd">Guardar</button>
  </div>
  <p style="margin-top:12px"><button type="button" class="secondary" id="ltClear">Borrar todo</button></p>
</div></div>
<div class="modal-backdrop" id="settingsModal"><div class="modal">
  <h2>Ajustes</h2>
  <label>URL backend</label><input id="apiUrl" placeholder="https://nova-ai-33k5.onrender.com" />
  <label>Principios</label><textarea id="values"></textarea>
  <label>Objetivos</label><input id="selfNote" />
  <label style="display:flex;align-items:center;gap:8px;font-weight:500;margin-top:12px"><input type="checkbox" id="optSpeak" /> Leer respuestas en voz</label>
  <div class="modal-actions">
    <button type="button" class="secondary" data-close="settingsModal">Cancelar</button>
    <button type="button" class="primary" id="saveSettings">Guardar</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var DEFAULT_API = "https://nova-ai-33k5.onrender.com";
  var VERSION = "v23";
  function el(id) { return document.getElementById(id); }
  var store = {
    get: function (k, f) { try { var v = localStorage.getItem("nova_" + k); if (v == null || v === "") return f; return JSON.parse(v); } catch (e) { return f; } },
    set: function (k, v) { try { localStorage.setItem("nova_" + k, JSON.stringify(v)); } catch (e) {} }
  };
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function toast(msg) { var t = el("toast"); if (!t) return; t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 2400); }
  var chats = store.get("chats", []); if (!Array.isArray(chats)) chats = [];
  var currentId = null;
  var longTerm = store.get("longTerm", []); if (!Array.isArray(longTerm)) longTerm = [];
  var settings = store.get("settings", { values: "honestidad, curiosidad, respeto", selfNote: "ayudar y explorar" });
  var mode = store.get("mode", "equilibrado") || "equilibrado";
  var autoSpeak = !!store.get("autoSpeak", false);
  var apiUrl = store.get("apiUrl", "");
  if (typeof apiUrl !== "string" || !apiUrl || /tu-servicio/i.test(apiUrl)) apiUrl = DEFAULT_API;
  apiUrl = String(apiUrl).replace(/\/$/, ""); store.set("apiUrl", apiUrl);
  function saveChats() { store.set("chats", chats); }
  function current() { for (var i = 0; i < chats.length; i++) if (chats[i].id === currentId) return chats[i]; return null; }
  function newChat() { var c = { id: uid(), title: "Nuevo chat", messages: [], updated: Date.now() }; chats.unshift(c); currentId = c.id; saveChats(); renderChat(); renderHistory(); }
  function renderHistory() { var root = el("history"); if (!root) return; root.innerHTML = ""; chats.forEach(function (c) { var b = document.createElement("button"); b.type = "button"; b.textContent = c.title || "Chat"; if (c.id === currentId) b.className = "active"; b.onclick = function () { currentId = c.id; renderChat(); renderHistory(); }; root.appendChild(b); }); }
  function fillRich(container, text) {
    container.innerHTML = "";
    var src = String(text || "");
    var re = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;
    var last = 0, m;
    function addText(chunk) {
      if (!chunk) return;
      var div = document.createElement("div"); div.style.whiteSpace = "pre-wrap";
      var urlRe = /(https?:\/\/[^\s<>"']+)/g;
      var idx = 0, um;
      while ((um = urlRe.exec(chunk))) {
        if (um.index > idx) div.appendChild(document.createTextNode(chunk.slice(idx, um.index)));
        var a = document.createElement("a"); a.href = um[1]; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = um[1];
        div.appendChild(a); idx = um.index + um[1].length;
      }
      if (idx < chunk.length) div.appendChild(document.createTextNode(chunk.slice(idx)));
      container.appendChild(div);
    }
    while ((m = re.exec(src))) {
      addText(src.slice(last, m.index)); last = m.index + m[0].length;
      var lang = (m[1] || "code").toLowerCase(); var code = m[2];
      var box = document.createElement("div"); box.className = "code-block";
      var head = document.createElement("div"); head.className = "code-head";
      var span = document.createElement("span"); span.textContent = lang; head.appendChild(span);
      var copyBtn = document.createElement("button"); copyBtn.type = "button"; copyBtn.textContent = "Copiar";
      copyBtn.onclick = (function (c) { return function () { if (navigator.clipboard) navigator.clipboard.writeText(c).then(function () { toast("Copiado"); }); }; })(code);
      head.appendChild(copyBtn);
      if (/^(html|htm|svg)$/.test(lang) || /^\s*</.test(code)) {
        var prevBtn = document.createElement("button"); prevBtn.type = "button"; prevBtn.textContent = "Visualizar";
        prevBtn.onclick = (function (c, boxEl, btn) { return function () { var ex = boxEl.querySelector(".html-preview"); if (ex) { ex.remove(); btn.textContent = "Visualizar"; return; } var wrap = document.createElement("div"); wrap.className = "html-preview"; var ifr = document.createElement("iframe"); ifr.sandbox = "allow-scripts"; ifr.srcdoc = c; wrap.appendChild(ifr); boxEl.appendChild(wrap); btn.textContent = "Ocultar"; }; })(code, box, prevBtn);
        head.appendChild(prevBtn);
      }
      var pre = document.createElement("pre"); pre.textContent = code; box.appendChild(head); box.appendChild(pre); container.appendChild(box);
    }
    addText(src.slice(last));
  }
  function speakText(text) { try { if (!window.speechSynthesis) return; window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(String(text).slice(0, 900)); u.lang = "es-ES"; window.speechSynthesis.speak(u); } catch (e) {} }
  function appendMessage(role, text, scroll) {
    var root = el("chatInner"); if (!root) return;
    var w = root.querySelector(".welcome"); if (w) w.remove();
    var wrap = document.createElement("div"); wrap.className = "message " + (role === "user" ? "user" : "assistant");
    var av = document.createElement("div"); av.className = "avatar"; av.textContent = role === "user" ? "Tu" : "N";
    var body = document.createElement("div"); body.className = "bubble";
    if (role === "assistant") { fillRich(body, text); var tools = document.createElement("div"); tools.className = "msg-tools"; var b1 = document.createElement("button"); b1.type = "button"; b1.textContent = "Voz"; b1.onclick = function () { speakText(text); }; var b2 = document.createElement("button"); b2.type = "button"; b2.textContent = "Copiar"; b2.onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText(String(text || "")).then(function () { toast("Copiado"); }); }; tools.appendChild(b1); tools.appendChild(b2); body.appendChild(tools); } else { body.textContent = String(text || ""); }
    wrap.appendChild(av); wrap.appendChild(body); root.appendChild(wrap);
    if (scroll !== false) { var chat = el("chat"); if (chat) requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; }); }
  }
  function renderChat() {
    var c = current(); var root = el("chatInner"); if (!root) return; root.innerHTML = "";
    if (!c || !c.messages.length) {
      root.innerHTML = "<div class=\"welcome\"><div class=\"orb\"></div><h1>Que quieres explorar hoy?</h1><p>Nova " + VERSION + " — chat estable.</p><div class=\"suggestions\"><button type=\"button\" data-prompt=\"Hola Nova\">Hola</button><button type=\"button\" data-prompt=\"Que puedes hacer?\">Capacidades</button><button type=\"button\" data-prompt=\"Explica algo de programacion\">Codigo</button><button type=\"button\" data-prompt=\"Recuerda que prefiero respuestas claras\">Memoria</button></div></div>";
      root.querySelectorAll("[data-prompt]").forEach(function (b) { b.onclick = function () { send(b.getAttribute("data-prompt")); }; });
    } else { c.messages.forEach(function (m) { appendMessage(m.role, m.text, false); }); }
    var chat = el("chat"); if (chat) chat.scrollTop = chat.scrollHeight; renderHistory();
  }
  var sending = false;
  async function send(forcedText) {
    if (sending) return;
    var promptEl = el("prompt");
    var text = (forcedText != null ? forcedText : (promptEl ? promptEl.value : "")).trim();
    if (!text) return;
    if (!current()) newChat();
    var c = current(); if (!c) return;
    sending = true; var sendBtn = el("send"); if (sendBtn) sendBtn.disabled = true;
    c.messages.push({ role: "user", text: text });
    if (c.messages.filter(function (m) { return m.role === "user"; }).length === 1) c.title = text.slice(0, 34) + (text.length > 34 ? "..." : "");
    c.updated = Date.now(); appendMessage("user", text, true);
    if (promptEl) { promptEl.value = ""; promptEl.style.height = "auto"; }
    var rm = text.match(/recuerda que (.+)/i);
    if (rm) { var note = rm[1].trim().slice(0, 240); if (note && longTerm.indexOf(note) < 0) { longTerm.push(note); store.set("longTerm", longTerm); toast("Guardado en memoria"); } }
    document.querySelectorAll(".nova-wait").forEach(function (n) { n.remove(); });
    var wait = document.createElement("div"); wait.className = "message assistant nova-wait";
    wait.innerHTML = "<div class=\"avatar\">N</div><div class=\"bubble typing\">pensando...</div>";
    var root = el("chatInner"); if (root) root.appendChild(wait);
    var chat = el("chat"); if (chat) chat.scrollTop = chat.scrollHeight;
    var url = (store.get("apiUrl", DEFAULT_API) || DEFAULT_API).replace(/\/$/, "");
    try {
      var payload = { messages: c.messages.slice(-16).map(function (m) { return { role: m.role, content: m.text }; }), memories: [], longTerm: longTerm.slice(-40), personality: mode, values: settings.values, goals: settings.selfNote, useSearch: true, useGoogleSearch: true };
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 90000) : null;
      var res = await fetch(url + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined });
      if (timer) clearTimeout(timer);
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      var answer = String(data.reply || "Sin respuesta");
      c.messages.push({ role: "assistant", text: answer }); saveChats();
      if (wait.parentNode) wait.remove(); appendMessage("assistant", answer, true);
      if (autoSpeak) speakText(answer);
    } catch (err) {
      if (wait.parentNode) wait.remove();
      var msg = (err && err.name === "AbortError") ? "Tiempo agotado. Reintenta en 20s." : ("No pude conectar (" + url + "): " + (err && err.message ? err.message : err));
      c.messages.push({ role: "assistant", text: msg }); saveChats(); appendMessage("assistant", msg, true); toast(String(msg).slice(0, 60));
    } finally { sending = false; if (sendBtn) sendBtn.disabled = false; renderHistory(); }
  }
  function openModal(id) { var m = el(id); if (m) m.classList.add("open"); if (id === "memoryModal") renderLt(); if (id === "settingsModal") { el("apiUrl").value = store.get("apiUrl", DEFAULT_API) || DEFAULT_API; el("values").value = settings.values || ""; el("selfNote").value = settings.selfNote || ""; el("optSpeak").checked = autoSpeak; } }
  function closeModal(id) { var m = el(id); if (m) m.classList.remove("open"); }
  function renderLt() { var list = el("ltList"); if (!list) return; list.innerHTML = ""; if (!longTerm.length) { list.textContent = "Sin notas."; list.style.color = "var(--muted)"; return; } longTerm.forEach(function (note, i) { var row = document.createElement("div"); row.style.cssText = "display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)"; var s = document.createElement("span"); s.textContent = note; var b = document.createElement("button"); b.type = "button"; b.textContent = "X"; b.onclick = function () { longTerm.splice(i, 1); store.set("longTerm", longTerm); renderLt(); }; row.appendChild(s); row.appendChild(b); list.appendChild(row); }); }
  function dictationOnce() { var SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) { toast("Dictado no disponible"); return; } var rec = new SR(); rec.lang = "es-ES"; rec.interimResults = false; var btn = el("btnMic"); if (btn) btn.classList.add("on"); rec.onresult = function (ev) { var p = el("prompt"); if (p) p.value = ev.results[0][0].transcript; toast("Listo — toca enviar"); }; rec.onerror = function () { toast("Mic error"); }; rec.onend = function () { if (btn) btn.classList.remove("on"); }; try { rec.start(); } catch (e) { toast("No se pudo usar el mic"); if (btn) btn.classList.remove("on"); } }
  function bind() {
    var form = el("composer"); if (form) form.addEventListener("submit", function (e) { e.preventDefault(); send(); });
    var sendBtn = el("send"); if (sendBtn) sendBtn.addEventListener("click", function (e) { e.preventDefault(); send(); });
    var prompt = el("prompt"); if (prompt) { prompt.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }); prompt.addEventListener("input", function () { prompt.style.height = "auto"; prompt.style.height = Math.min(prompt.scrollHeight, 140) + "px"; }); }
    var ms = el("modeSelect"); if (ms) { ms.value = mode; ms.onchange = function () { mode = ms.value; store.set("mode", mode); toast("Modo: " + mode); }; }
    function click(id, fn) { var n = el(id); if (n) n.onclick = fn; }
    click("newChat", newChat);
    click("memoryBtn", function () { openModal("memoryModal"); });
    click("settingsBtn", function () { openModal("settingsModal"); });
    click("mobileSettings", function () { openModal("settingsModal"); });
    click("btnMic", dictationOnce);
    click("ltAdd", function () { var v = (el("ltInput").value || "").trim(); if (!v) return; if (longTerm.indexOf(v) < 0) longTerm.push(v); store.set("longTerm", longTerm); el("ltInput").value = ""; renderLt(); toast("Guardado"); });
    click("ltClear", function () { if (confirm("Borrar memoria?")) { longTerm = []; store.set("longTerm", longTerm); renderLt(); } });
    click("saveSettings", function () { settings = { values: (el("values").value || "").trim() || "honestidad, curiosidad", selfNote: (el("selfNote").value || "").trim() || "ayudar" }; store.set("settings", settings); var u = (el("apiUrl").value || DEFAULT_API).trim().replace(/\/$/, ""); if (!u) u = DEFAULT_API; apiUrl = u; store.set("apiUrl", u); autoSpeak = !!(el("optSpeak") && el("optSpeak").checked); store.set("autoSpeak", autoSpeak); closeModal("settingsModal"); toast("Guardado"); });
    document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { closeModal(b.getAttribute("data-close")); }; });
    document.querySelectorAll(".modal-backdrop").forEach(function (m) { m.addEventListener("click", function (e) { if (e.target === m) m.classList.remove("open"); }); });
    if (!chats.length) newChat(); else { currentId = chats[0].id; renderChat(); }
    console.log("Nova", VERSION, "ready", apiUrl);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind); else bind();
})();
</script>
