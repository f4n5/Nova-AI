<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>Nova</title>
<style>
:root {
  --bg: #f7f7f8;
  --sidebar: #f0f0f2;
  --panel: #ffffff;
  --text: #0d0d0d;
  --muted: #6e6e80;
  --border: rgba(0,0,0,.08);
  --border2: rgba(0,0,0,.12);
  --accent: #0d0d0d;
  --user-bg: #ebebf0;
  --soft: rgba(0,0,0,.04);
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow: 0 8px 30px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid #7c6cf0; outline-offset: 2px;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: #cfcfd6; border-radius: 8px; }

.app {
  height: 100dvh;
  height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
  overflow: hidden;
}

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 12px;
  gap: 8px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1rem;
  padding: 8px 8px 12px;
}
.logo {
  width: 30px; height: 30px; border-radius: 10px;
  background: linear-gradient(135deg, #c4b5fd, #7c6cf0);
  color: #fff; display: grid; place-items: center;
  font-weight: 800; font-size: 0.85rem;
}
.pill {
  font-size: 0.68rem; font-weight: 600;
  padding: 2px 8px; border-radius: 999px;
  background: #ebe4ff; color: #5b4bb0;
}
.newchat {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--panel);
  font-size: 0.9rem; font-weight: 500;
}
.newchat:hover { background: #fafafa; }
.section-label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding: 10px 8px 4px;
}
.history {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
}
.history button {
  text-align: left; padding: 9px 12px; border-radius: 10px;
  font-size: 0.88rem; color: #333;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.history button:hover { background: var(--soft); }
.history button.active { background: #e4e4ea; font-weight: 600; }
.side-bottom {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  display: grid; gap: 6px;
}
.sidebtn {
  text-align: left; padding: 9px 12px; border-radius: 10px;
  font-size: 0.88rem; color: #333;
}
.sidebtn:hover { background: var(--soft); }
.privacy { font-size: 0.72rem; color: var(--muted); padding: 4px 8px; }

.main {
  min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
.topbar {
  flex: 0 0 auto;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  z-index: 2;
}
.model { font-weight: 650; font-size: 0.95rem; }
.model span { color: var(--muted); font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--panel);
  display: grid; place-items: center;
}

/* ONLY chat scrolls */
.chat {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 16px 8px;
  -webkit-overflow-scrolling: touch;
}
.chat-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 8px;
  width: 100%;
}

.welcome {
  margin: 8vh auto 0;
  text-align: center;
  max-width: 480px;
  animation: fadeUp .35s ease;
}
.orb {
  width: 56px; height: 56px; margin: 0 auto 16px;
  border-radius: 18px;
  background: radial-gradient(circle at 35% 25%, #e9e0ff, #8b7cf0 55%, #5a4bc4);
  box-shadow: 0 12px 40px rgba(124,108,240,.25);
  animation: pulse 3.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
.welcome h1 { font-size: 1.55rem; font-weight: 650; letter-spacing: -.02em; margin-bottom: 8px; }
.welcome p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
.suggestions {
  margin-top: 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  text-align: left;
}
.suggestions button {
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel);
  font-size: 0.86rem;
  color: #333;
  transition: transform .15s, box-shadow .15s;
}
.suggestions button:hover {
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.message {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  width: 100%;
  min-width: 0;
  animation: fadeUp .28s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.message.user { justify-content: flex-end; }
.avatar {
  flex: 0 0 30px;
  width: 30px; height: 30px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 0.72rem; font-weight: 700;
  background: #ebe4ff; color: #5b4bb0;
  margin-top: 2px;
}
.message.user .avatar {
  order: 2;
  background: #e4e4ea; color: #333;
}
.bubble {
  max-width: min(100%, 620px);
  min-width: 0;
  line-height: 1.55;
  font-size: 0.95rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.message.user .bubble {
  background: var(--user-bg);
  padding: 10px 14px;
  border-radius: 18px 18px 6px 18px;
}
.message.assistant .bubble {
  padding: 4px 0;
  max-width: calc(100% - 48px);
  flex: 1;
}
.bubble.typing {
  color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.dots span {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--muted);
  margin-right: 3px;
  animation: bounce 1.1s infinite ease-in-out;
}
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: .4; }
  40% { transform: translateY(-4px); opacity: 1; }
}

/* composer pinned — never scrolls away */
.composer-wrap {
  flex: 0 0 auto;
  padding: 8px 16px 14px;
  background: linear-gradient(to top, var(--bg) 65%, transparent);
  z-index: 3;
}
.composer {
  max-width: 720px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 10px 12px 10px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  box-shadow: var(--shadow);
}
.composer:focus-within {
  border-color: rgba(124,108,240,.45);
  box-shadow: 0 8px 32px rgba(124,108,240,.12);
}
.composer textarea {
  flex: 1;
  border: 0; outline: none; resize: none;
  background: transparent;
  min-height: 24px; max-height: 140px;
  line-height: 1.45;
  font-size: 0.95rem;
  padding: 6px 0;
}
.composer textarea::placeholder { color: #9a9aaa; }
.send {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.send:disabled { opacity: .28; cursor: default; }
.composer-hint {
  max-width: 720px;
  margin: 8px auto 0;
  text-align: center;
  font-size: 0.72rem;
  color: var(--muted);
}

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center; justify-content: center;
  padding: 16px;
  z-index: 50;
  pointer-events: none;
}
.modal-backdrop.open { display: flex; pointer-events: auto; }
.modal {
  width: min(480px, 100%);
  max-height: min(85vh, 640px);
  overflow: auto;
  background: var(--panel);
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
  animation: fadeUp .22s ease;
}
.modal h2 { font-size: 1.1rem; margin-bottom: 6px; }
.modal p { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; line-height: 1.45; }
.modal label {
  display: block; font-size: 0.78rem; color: var(--muted);
  margin: 12px 0 4px;
}
.modal input, .modal textarea, .modal select {
  width: 100%;
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 12px;
  background: #fafafa;
  outline: none;
}
.modal textarea { min-height: 72px; resize: vertical; }
.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 16px;
}
.primary, .secondary {
  padding: 8px 14px; border-radius: 10px; font-size: 0.88rem; font-weight: 600;
}
.primary { background: var(--accent); color: #fff; }
.secondary { border: 1px solid var(--border2); color: #333; background: #fff; }
.memory-list { margin-bottom: 10px; }
.memory-item {
  display: flex; gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
}
.memory-item span { flex: 1; }
.memory-item button {
  font-size: 0.75rem; color: var(--muted);
  padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
}
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: #1a1a1f; color: #fff;
  padding: 10px 16px; border-radius: 12px;
  font-size: 0.85rem; display: none; z-index: 60;
}

@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .suggestions { grid-template-columns: 1fr; }
  .composer-wrap { padding: 8px 12px 12px; }
  .chat { padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">N</div> Nova <span class="pill">BETA</span></div>
    <button type="button" class="newchat" id="newChat">+ Nuevo chat</button>
    <div class="section-label">Conversaciones</div>
    <div class="history" id="history"></div>
    <div class="side-bottom">
      <button type="button" class="sidebtn" id="memoryBtn">Memoria</button>
      <button type="button" class="sidebtn" id="settingsBtn">Ajustes</button>
      <div class="privacy">Gemini · datos en este navegador</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="model">Nova <span>· asistente</span></div>
      <div class="top-actions">
        <span class="pill">Gemini</span>
        <button type="button" class="iconbtn" id="mobileSettings" title="Ajustes">⚙️</button>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Mensaje a Nova…" aria-label="Mensaje"></textarea>
        <button class="send" id="send" type="submit" aria-label="Enviar" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg>
        </button>
      </form>
      <div class="composer-hint">Enter envía · el cuadro de texto siempre queda visible abajo</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="memoryModal">
  <div class="modal">
    <h2>Memoria</h2>
    <p>Preferencias locales en este navegador.</p>
    <div id="memoryList" class="memory-list"></div>
    <label for="memoryInput">Añadir memoria</label>
    <input id="memoryInput" placeholder="Ej.: prefiero respuestas cortas" />
    <div class="modal-actions">
      <button type="button" class="secondary" data-close="memoryModal">Cerrar</button>
      <button type="button" class="primary" id="addMemory">Guardar</button>
    </div>
    <p style="margin-top:12px"><button type="button" class="secondary" id="clearMemory">Borrar todas</button></p>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>Ajustes</h2>
    <p>Personalidad y URL del backend. La API key nunca va aquí.</p>
    <label for="persona">Estilo</label>
    <select id="persona">
      <option value="equilibrado">Equilibrado</option>
      <option value="amigable">Amigable</option>
      <option value="directo">Directo</option>
      <option value="filosofico">Filosófico</option>
      <option value="creativo">Creativo</option>
    </select>
    <label for="values">Principios</label>
    <textarea id="values" placeholder="honestidad, curiosidad…"></textarea>
    <label for="selfNote">Objetivos</label>
    <input id="selfNote" placeholder="explorar ideas" />
    <label for="apiUrl">URL del backend</label>
    <input id="apiUrl" placeholder="https://nova-ai-33k5.onrender.com" />
    <div class="modal-actions">
      <button type="button" class="secondary" data-close="settingsModal">Cancelar</button>
      <button type="button" class="primary" id="saveSettings">Guardar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var DEFAULT_API = "https://nova-ai-33k5.onrender.com";
  var $ = function (s) { return document.querySelector(s); };

  var store = {
    get: function (k, f) {
      try {
        var v = localStorage.getItem("nova_" + k);
        if (v == null || v === "") return f;
        return JSON.parse(v);
      } catch (e) { return f; }
    },
    set: function (k, v) {
      try { localStorage.setItem("nova_" + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function toast(msg) {
    var el = $("#toast");
    if (!el) return;
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.style.display = "none"; }, 2200);
  }

  var chats = store.get("chats", []);
  if (!Array.isArray(chats)) chats = [];
  var currentId = null;
  var memories = store.get("memories", []);
  if (!Array.isArray(memories)) memories = [];
  var settings = store.get("settings", {
    persona: "equilibrado",
    values: "honestidad, curiosidad, respeto y creatividad",
    selfNote: "explorar ideas y aprender de las conversaciones"
  });

  var apiUrl = store.get("apiUrl", "");
  if (typeof apiUrl !== "string" || !apiUrl || /TU-SERVICIO|tu-servicio/i.test(apiUrl)) {
    apiUrl = DEFAULT_API;
  }
  apiUrl = String(apiUrl).replace(/\/$/, "");
  store.set("apiUrl", apiUrl);

  function saveChats() { store.set("chats", chats); }
  function current() {
    for (var i = 0; i < chats.length; i++) if (chats[i].id === currentId) return chats[i];
    return null;
  }

  function newChat() {
    var c = { id: uid(), title: "Nuevo chat", messages: [], updated: Date.now() };
    chats.unshift(c);
    currentId = c.id;
    saveChats();
    renderChat();
    renderHistory();
    var p = $("#prompt"); if (p) p.focus();
  }

  function renderHistory() {
    var root = $("#history");
    root.innerHTML = "";
    chats.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = c.title || "Chat";
      if (c.id === currentId) b.className = "active";
      b.onclick = function () {
        currentId = c.id;
        renderChat();
        renderHistory();
      };
      root.appendChild(b);
    });
  }

  function appendMessage(role, text, scroll) {
    var root = $("#chatInner");
    var welcome = root.querySelector(".welcome");
    if (welcome) welcome.remove();

    var wrap = document.createElement("div");
    wrap.className = "message " + (role === "user" ? "user" : "assistant");
    var av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "user" ? "Tú" : "N";
    var body = document.createElement("div");
    body.className = "bubble";
    body.textContent = String(text || "").replace(/\r\n/g, "\n");
    wrap.appendChild(av);
    wrap.appendChild(body);
    root.appendChild(wrap);
    if (scroll !== false) {
      var chat = $("#chat");
      requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; });
    }
  }

  function wireSuggestions() {
    document.querySelectorAll("[data-prompt]").forEach(function (b) {
      b.onclick = function () { send(b.getAttribute("data-prompt")); };
    });
  }

  function renderChat() {
    var c = current();
    var root = $("#chatInner");
    root.innerHTML = "";
    if (!c || !c.messages.length) {
      root.innerHTML =
        '<div class="welcome">' +
        '<div class="orb"></div>' +
        "<h1>¿Qué quieres explorar hoy?</h1>" +
        "<p>Nova adapta el tono y guarda memoria local en tu navegador.</p>" +
        '<div class="suggestions">' +
        '<button type="button" data-prompt="¿Qué puedes hacer y qué límites tienes?">Conóceme</button>' +
        '<button type="button" data-prompt="Ayúdame a crear una idea desde cero.">Crear algo</button>' +
        '<button type="button" data-prompt="Quiero que aprendas cómo me gusta conversar.">Personalizar</button>' +
        '<button type="button" data-prompt="¿Cómo funciona tu memoria?">Memoria</button>' +
        "</div></div>";
      wireSuggestions();
    } else {
      c.messages.forEach(function (m) { appendMessage(m.role, m.text, false); });
    }
    var chat = $("#chat");
    chat.scrollTop = chat.scrollHeight;
    renderHistory();
  }

  function rememberFrom(t) {
    var m = t.match(/recuerda que (.+)/i) || t.match(/prefiero (.+)/i);
    if (m) {
      var note = m[1].trim().slice(0, 200);
      if (note && memories.indexOf(note) < 0) {
        memories.push(note);
        store.set("memories", memories);
        return note;
      }
    }
    return null;
  }

  async function send(text) {
    var promptEl = $("#prompt");
    var t = (text != null ? text : promptEl.value).trim();
    if (!t) return;
    if (!current()) newChat();
    var c = current();
    c.messages.push({ role: "user", text: t });
    if (c.messages.length === 1) {
      c.title = t.slice(0, 34) + (t.length > 34 ? "…" : "");
    }
    c.updated = Date.now();
    appendMessage("user", t);
    promptEl.value = "";
    promptEl.style.height = "auto";
    $("#send").disabled = true;

    rememberFrom(t);
    var url = store.get("apiUrl", DEFAULT_API);
    if (typeof url !== "string" || !url) url = DEFAULT_API;
    url = String(url).trim().replace(/\/$/, "");

    var wait = document.createElement("div");
    wait.className = "message assistant";
    wait.id = "nova-wait";
    var av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "N";
    var body = document.createElement("div");
    body.className = "bubble typing";
    body.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> pensando…';
    wait.appendChild(av);
    wait.appendChild(body);
    $("#chatInner").appendChild(wait);
    $("#chat").scrollTop = $("#chat").scrollHeight;

    try {
      var payload = {
        messages: c.messages.slice(-16).map(function (m) {
          return { role: m.role, content: m.text };
        }),
        memories: memories.slice(-40),
        personality: settings.persona,
        values: settings.values,
        goals: settings.selfNote
      };
      var res = await fetch(url + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      var answer = String(data.reply || "Sin respuesta del modelo.");
      c.messages.push({ role: "assistant", text: answer });
      saveChats();
      wait.remove();
      appendMessage("assistant", answer);
    } catch (err) {
      wait.remove();
      var answer = "No pude conectar con el backend (" + url + "). " + (err && err.message ? err.message : err);
      c.messages.push({ role: "assistant", text: answer });
      saveChats();
      appendMessage("assistant", answer);
    } finally {
      $("#send").disabled = !$("#prompt").value.trim();
      renderHistory();
    }
  }

  function openModal(id) {
    var el = $("#" + id);
    if (el) el.classList.add("open");
    if (id === "memoryModal") renderMemories();
    if (id === "settingsModal") {
      $("#persona").value = settings.persona || "equilibrado";
      $("#values").value = settings.values || "";
      $("#selfNote").value = settings.selfNote || "";
      $("#apiUrl").value = store.get("apiUrl", DEFAULT_API) || DEFAULT_API;
    }
  }
  function closeModal(id) {
    var el = $("#" + id);
    if (el) el.classList.remove("open");
  }

  function renderMemories() {
    var el = $("#memoryList");
    el.innerHTML = "";
    if (!memories.length) {
      el.textContent = "Sin memorias todavía.";
      el.style.color = "var(--muted)";
      return;
    }
    el.style.color = "";
    memories.forEach(function (m, i) {
      var row = document.createElement("div");
      row.className = "memory-item";
      var txt = document.createElement("span");
      txt.textContent = m;
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "Eliminar";
      b.onclick = function () {
        memories.splice(i, 1);
        store.set("memories", memories);
        renderMemories();
      };
      row.appendChild(txt);
      row.appendChild(b);
      el.appendChild(row);
    });
  }

  function bind() {
    $("#composer").addEventListener("submit", function (e) {
      e.preventDefault();
      send();
    });
    $("#prompt").addEventListener("input", function () {
      var ta = $("#prompt");
      $("#send").disabled = !ta.value.trim();
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
    });
    $("#prompt").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    $("#newChat").onclick = newChat;
    $("#memoryBtn").onclick = function () { openModal("memoryModal"); };
    $("#settingsBtn").onclick = function () { openModal("settingsModal"); };
    $("#mobileSettings").onclick = function () { openModal("settingsModal"); };

    $("#addMemory").onclick = function () {
      var v = $("#memoryInput").value.trim();
      if (!v) return;
      if (memories.indexOf(v) < 0) memories.push(v);
      store.set("memories", memories);
      $("#memoryInput").value = "";
      renderMemories();
      toast("Memoria guardada");
    };
    $("#clearMemory").onclick = function () {
      if (confirm("¿Borrar todas las memorias?")) {
        memories = [];
        store.set("memories", memories);
        renderMemories();
        toast("Memorias borradas");
      }
    };

    $("#saveSettings").onclick = function () {
      settings = {
        persona: $("#persona").value,
        values: $("#values").value.trim() || "honestidad, curiosidad y respeto",
        selfNote: $("#selfNote").value.trim() || "explorar ideas"
      };
      store.set("settings", settings);
      var u = ($("#apiUrl").value || DEFAULT_API).trim().replace(/\/$/, "");
      if (!u) u = DEFAULT_API;
      store.set("apiUrl", u);
      closeModal("settingsModal");
      toast("Ajustes guardados");
    };

    document.querySelectorAll("[data-close]").forEach(function (b) {
      b.onclick = function () { closeModal(b.getAttribute("data-close")); };
    });
    document.querySelectorAll(".modal-backdrop").forEach(function (m) {
      m.addEventListener("click", function (e) {
        if (e.target === m) m.classList.remove("open");
      });
    });

    if (!chats.length) newChat();
    else {
      currentId = chats[0].id;
      renderChat();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
</body>
</html>
